[general]
	#Number of days to keep backup files. Older backups will be automatically deleted. 7 - keep for 7 days.
	# Default: 7
	# Range: 1 ~ 365
	retentionDays = 3
	#true - saves inventory every N seconds.
	tickSaveEnabled = true
	#Determines the frequency at which inventory will be saved in seconds. 600 - every 10 minutes.
	# Default: 600
	# Range: -1 ~ 9223372036854775807
	preservationPeriod = 600
	#true - saves inventory on death
	deadSaveEnabled = true
	#true - saves inventory when player joins the server
	joinSaveEnabled = true
	#true - saves inventory when player quits the server
	quitSaveEnabled = true

[enderchest]
	#true - enable ender chest backup functionality
	enderChestEnabled = true
	#true - saves ender chest every N seconds (uses preservationPeriod)
	enderChestTickSaveEnabled = true
	#true - saves ender chest on death
	enderChestDeadSaveEnabled = true
	#true - saves ender chest when player joins the server
	enderChestJoinSaveEnabled = true
	#true - saves ender chest when player quits the server
	enderChestQuitSaveEnabled = true
	#true - saves ender chest when player opens it
	enderChestOpenSaveEnabled = false
